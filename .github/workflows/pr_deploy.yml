# Builds every PR and deploys a preview for PRs from branches in this repository.
# PRs from forks are built and checked only: GitHub doesn't pass secrets to
# pull_request runs from forks, so they get no preview.
#

name: Deploy to Preview Channel

on:
  pull_request:
    paths:
      - "content/**"
      - "scripts/**"
      - "package*.json"
      - ".github/workflows/pr_deploy.yml"

# A new push to the same PR cancels the preview run that is still going
concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # PRs from branches in this repo: build and deploy automatically.
  build_and_preview_same_repo:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.0'
          extended: true
      - name: Build
        run: |
          cd content/ai_exchange
          hugo mod get github.com/imfing/hextra@v0.11.1
          hugo --gc --minify
      - name: Check internal and /go/ links
        run: node scripts/check-links.js
      - name: Build search index (Pagefind)
        run: npx pagefind --site public
        working-directory: content/ai_exchange
      - name: Generate PDF
        run: |
          npm ci
          npm run build:pdf
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          expires: 3d
          projectId: project-integration-standards
          target: owasp-ai-exchange
          entryPoint: content/ai_exchange

  # PRs from forks: build only, no preview. GitHub doesn't pass secrets to pull_request runs
  # from forks, so a Firebase deploy can't work here. The build still fails the check when the
  # site, links, search index or PDF are broken.
  build_and_preview_fork:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.0'
          extended: true
      - name: Build
        run: |
          cd content/ai_exchange
          hugo mod get github.com/imfing/hextra@v0.11.1
          hugo --gc --minify
      - name: Check internal and /go/ links
        run: node scripts/check-links.js
      - name: Build search index (Pagefind)
        run: npx pagefind --site public
        working-directory: content/ai_exchange
      - name: Generate PDF
        run: |
          npm ci
          npm run build:pdf
      - name: Preview deploy skipped
        run: echo "::notice title=Preview deploy skipped::PRs from forks are built and checked, but not deployed to a preview channel (no access to the Firebase secret)."
