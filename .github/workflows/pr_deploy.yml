# Preview deploy for PRs.
#
# - PRs from branches in this repo: build and deploy a Firebase preview channel.
# - PRs from forks: build only (site, search index, PDF) as a check. GitHub does
#   not expose repository secrets to `pull_request` runs from forks, so the
#   Firebase deploy is skipped instead of failing.
#
# Do not switch this to `pull_request_target` to get fork previews: the build
# runs `npm ci` / `npm run build:pdf` from the PR's code, which would execute
# fork-controlled scripts with the Firebase service account available. If fork
# previews are wanted later, build here and deploy the uploaded artifact from a
# separate `workflow_run` workflow that never executes PR code.

name: Deploy to Preview Channel

on:
  pull_request:
    paths:
      - "content/**"

jobs:
  # PRs from branches in this repo: build and deploy automatically.
  build_and_preview_same_repo:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.0'
          extended: true
      - name: Build
        run: |
          cd content/ai_exchange
          hugo mod get github.com/imfing/hextra@v0.11.1
          hugo --gc --minify
      - name: Build search index (Pagefind)
        run: npx pagefind --site public
        working-directory: content/ai_exchange
      - name: Generate PDF
        run: |
          npm ci
          npm run build:pdf
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          expires: 3d
          projectId: project-integration-standards
          target: owasp-ai-exchange
          entryPoint: content/ai_exchange

  # PRs from forks: build-check only. Secrets are not available here, so the
  # deploy step is skipped rather than failing the check.
  build_and_preview_fork:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    env:
      HAS_FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.0'
          extended: true
      - name: Build
        run: |
          cd content/ai_exchange
          hugo mod get github.com/imfing/hextra@v0.11.1
          hugo --gc --minify
      - name: Build search index (Pagefind)
        run: npx pagefind --site public
        working-directory: content/ai_exchange
      - name: Generate PDF
        run: |
          npm ci
          npm run build:pdf
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.HAS_FIREBASE_SA == 'true'
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          expires: 3d
          projectId: project-integration-standards
          target: owasp-ai-exchange
          entryPoint: content/ai_exchange
      - name: Note skipped preview
        if: env.HAS_FIREBASE_SA != 'true'
        run: echo "::notice::Fork PR built successfully; preview deploy skipped (secrets are not available to fork PRs)."
