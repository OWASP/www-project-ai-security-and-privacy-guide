name: Deploy to Live Channel

on:
  push:
    branches:
      - main
    # Optionally configure to run only for specific files. For example:
    # paths:
    # - "website/**"

# Only the newest push to main needs to go live: a newer push cancels an older run still going
concurrency:
  group: deploy-live
  cancel-in-progress: true

jobs:
  deploy_live_website:
    # Only the OWASP repository deploys the live site. Forks have no Firebase secret, so the job is
    # skipped there. In this repository it still fails when the secret is missing, so a broken
    # deploy never shows up as green.
    if: github.repository == 'OWASP/www-project-ai-security-and-privacy-guide'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Add any build steps here. For example:
      # - run: npm ci && npm run build
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.0'
          extended: true
      - name: Build
        run: |
         cd content/ai_exchange
         hugo mod get github.com/imfing/hextra@v0.11.1
         hugo --gc --minify
      - name: Build search index (Pagefind)
        run: npx pagefind --site public
        working-directory: content/ai_exchange
      - name: Cache Puppeteer browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ hashFiles('package-lock.json') }}      
      - name: Generate PDF
        run: |
          npm ci
          npm run build:pdf
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: project-integration-standards
          target: owasp-ai-exchange
          channelId: live
          entryPoint: content/ai_exchange
